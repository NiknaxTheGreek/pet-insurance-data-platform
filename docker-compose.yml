services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insurance_app} -d ${POSTGRES_DB:-insurance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
