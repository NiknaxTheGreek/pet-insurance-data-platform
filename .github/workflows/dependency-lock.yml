name: Dependency Lock

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-dependency-lock.trigger"

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install complete tested toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion,dev,orchestration]"
          python -m pip install             "dbt-snowflake==1.12.1"             "pip-audit==2.10.1"             "ruff==0.13.2"

      - name: Generate resolved lock
        run: |
          mkdir -p requirements
          python -m pip freeze --all             | grep -v '^pet-insurance-data-platform=='             | grep -v '^-e '             | LC_ALL=C sort             > requirements/ci.lock.txt
          python -m pip check
          echo "LOCK_PACKAGE_COUNT=$(wc -l < requirements/ci.lock.txt)"
          cat requirements/ci.lock.txt

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: ci-dependency-lock
          path: requirements/ci.lock.txt
          retention-days: 90
