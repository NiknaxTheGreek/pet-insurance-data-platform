name: dbt Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-build.yml"
  pull_request:
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-build.yml"

permissions:
  id-token: write
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Install dbt Snowflake adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-snowflake==1.12.1"
          dbt --version

      - name: dbt debug
        env: &snowflake_env
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: dbt debug --project-dir dbt --profiles-dir dbt

      - name: dbt build
        env: *snowflake_env
        run: dbt build --project-dir dbt --profiles-dir dbt --fail-fast

      - name: Generate dbt docs artifacts
        env: *snowflake_env
        run: dbt docs generate --project-dir dbt --profiles-dir dbt

      - name: Verify trusted marts
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            SELECT CLAIM_ID, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT, PAID_AMOUNT
            FROM PET_INSURANCE_MARTS.FCT_CLAIMS
            WHERE CLAIM_ID = 'CLM-10042';

            SELECT CLAIM_ID, CLAIM_STATUS, SOURCE_UPDATED_AT
            FROM PET_INSURANCE_INTERMEDIATE.INT_CLAIM_EVENTS
            WHERE CLAIM_ID = 'CLM-10042'
            ORDER BY SOURCE_UPDATED_AT;

            SELECT PROVINCE, SPECIES, PLAN_TYPE, POLICY_COUNT, CLAIM_COUNT,
                   INCURRED_CLAIM_AMOUNT, PAID_CLAIM_AMOUNT, PAID_LOSS_RATIO_PROXY
            FROM PET_INSURANCE_MARTS.MART_PORTFOLIO_PERFORMANCE
            ORDER BY PROVINCE, SPECIES, PLAN_TYPE;
          " -x

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/catalog.json
            dbt/target/index.html
