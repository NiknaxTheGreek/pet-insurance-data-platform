name: Estuary Source Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-estuary-readiness.trigger"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock.txt
          python -m pip install -e . --no-deps

      - name: Verify Neon logical-replication readiness and isolated publication
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: python -m insurance_platform.estuary_source_readiness
