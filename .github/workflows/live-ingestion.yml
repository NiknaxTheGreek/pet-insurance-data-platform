name: Live Incremental Ingestion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-live-ingestion.trigger"

permissions:
  id-token: write
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Install ingestion runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion]"

      - name: Run incremental PostgreSQL to Snowflake ingestion
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: |
          test -n "$POSTGRES_DSN" || (echo "::error::POSTGRES_DSN repository secret is required" && exit 1)
          python -m insurance_platform.run_ingestion

      - name: Verify ingestion audit and health
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            SELECT 1 / IFF(
              COUNT(*) = 5
              AND COUNT_IF(STATUS = 'SUCCESS') = 5
              AND COUNT_IF(RECONCILIATION_STATUS = 'CONSISTENT') = 5,
              1, 0
            ) AS CURRENT_RUN_AUDIT_ASSERTION
            FROM PET_INSURANCE_CONTROL.INGESTION_BATCHES
            WHERE GITHUB_RUN_ID = '${{ github.run_id }}';

            SELECT 1 / IFF(COUNT(*) = 0, 1, 0) AS STAGE_CLEANUP_ASSERTION
            FROM PET_INSURANCE_CONTROL.INGESTION_STAGE
            WHERE BATCH_ID LIKE '${{ github.run_id }}-%';

            SELECT
              SOURCE_TABLE,
              LATEST_STATUS,
              LAST_SUCCESS_AT,
              LAST_FAILURE_AT,
              SOURCE_WATERMARK_AT,
              LAST_SOURCE_ROWS,
              LAST_ROWS_EXTRACTED,
              LAST_ROWS_INSERTED,
              LAST_DURATION_MS,
              LAST_RETRY_COUNT,
              LAST_RECONCILIATION_STATUS,
              LAST_ERROR_CLASS
            FROM PET_INSURANCE_CONTROL.INGESTION_HEALTH
            ORDER BY SOURCE_TABLE;

            SELECT
              BATCH_ID,
              SOURCE_TABLE,
              STATUS,
              SOURCE_ROWS,
              ROWS_EXTRACTED,
              ROWS_INSERTED,
              DURATION_MS,
              RETRY_COUNT,
              RECONCILIATION_STATUS,
              WATERMARK_BEFORE_AT,
              WATERMARK_AFTER_AT
            FROM PET_INSURANCE_CONTROL.INGESTION_BATCHES
            WHERE GITHUB_RUN_ID = '${{ github.run_id }}'
            ORDER BY STARTED_AT;
          " -x
