name: Performance Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/snowflake/performance_evidence.sql"
      - "dbt/models/intermediate/int_claim_events.sql"
      - ".github/workflows/performance-evidence.yml"

permissions:
  id-token: write
  contents: read

jobs:
  performance-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Install dbt adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-snowflake==1.12.1"

      - name: Capture pre-run evidence
        env: &sf_env
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: snow sql -f infra/snowflake/performance_evidence.sql -x | tee /tmp/pre.txt

      - name: Run incremental claim-event model twice
        env: *sf_env
        run: |
          dbt run --project-dir dbt --profiles-dir dbt --select int_claim_events
          dbt run --project-dir dbt --profiles-dir dbt --select int_claim_events

      - name: Capture post-run evidence
        env: *sf_env
        run: snow sql -f infra/snowflake/performance_evidence.sql -x | tee /tmp/post.txt

      - name: Assert no-op incremental path preserved row count
        env: *sf_env
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;
            SELECT 1 / IFF(
              (SELECT COUNT(*) FROM PET_INSURANCE_INTERMEDIATE.INT_CLAIM_EVENTS) =
              (SELECT COUNT(*) FROM PET_INSURANCE_RAW.SOURCE_RECORDS WHERE LOWER(SOURCE_TABLE) = 'claims')
              AND
              (SELECT COUNT(*) FROM PET_INSURANCE_RAW.SOURCE_RECORDS
               WHERE LOWER(SOURCE_TABLE) = 'claims'
                 AND RAW_RECORD_ID > (
                   SELECT COALESCE(MAX(RAW_RECORD_ID), 0)
                   FROM PET_INSURANCE_INTERMEDIATE.INT_CLAIM_EVENTS
                 )) = 0,
              1, 0
            ) AS INCREMENTAL_NOOP_ASSERTION;
          " -x
