name: Estuary Snowflake Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-estuary-materialization.trigger"

permissions:
  contents: read
  id-token: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      ESTUARY_PREFIX: Private77
      ESTUARY_SNOWFLAKE_HOST: VEGYNBL-HC48216.snowflakecomputing.com
      ESTUARY_SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
      ESTUARY_SNOWFLAKE_SCHEMA: PET_INSURANCE_ESTUARY
      ESTUARY_SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
      ESTUARY_SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
      ESTUARY_SNOWFLAKE_USER: PET_INSURANCE_GITHUB

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked runtime
        run: |
          python -m pip install -r requirements/ci.lock.txt
          python -m pip install -e . --no-deps

      - name: Install flowctl
        run: |
          sudo curl -fsSL -o /usr/local/bin/flowctl \
            https://github.com/estuary/flow/releases/latest/download/flowctl-x86_64-linux
          sudo chmod +x /usr/local/bin/flowctl
          flowctl --version

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Prepare Snowflake target schema
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE ROLE SNOWFLAKE_LEARNING_ROLE;
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;
            CREATE SCHEMA IF NOT EXISTS PET_INSURANCE_ESTUARY;
          " -x

      - name: Generate ephemeral Estuary Snowflake keypair
        id: keypair
        run: |
          mkdir -p /tmp/estuary-key
          openssl genrsa 2048 \
            | openssl pkcs8 -topk8 -inform PEM \
              -out /tmp/estuary-key/rsa_key.p8 -nocrypt
          openssl rsa \
            -in /tmp/estuary-key/rsa_key.p8 \
            -pubout \
            -out /tmp/estuary-key/rsa_key.pub

          awk 'BEGIN{ORS=""} !/BEGIN PUBLIC KEY|END PUBLIC KEY/ {gsub(/\r/,""); printf "%s",$0} END{print ""}' \
            /tmp/estuary-key/rsa_key.pub \
            > /tmp/estuary-key/public_body.txt

          echo "=== COPY PUBLIC KEY BODY BELOW ==="
          cat /tmp/estuary-key/public_body.txt
          echo
          echo "=== END PUBLIC KEY BODY ==="

          while IFS= read -r line; do
            echo "::add-mask::$line"
          done < /tmp/estuary-key/rsa_key.p8

      - name: Wait for Snowflake public-key assignment
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
        run: |
          python - <<'PY'
          import time
          import snowflake.connector

          deadline = time.time() + 900
          last_error = None
          while time.time() < deadline:
              try:
                  conn = snowflake.connector.connect(
                      account="VEGYNBL-HC48216",
                      user="PET_INSURANCE_GITHUB",
                      private_key_file="/tmp/estuary-key/rsa_key.p8",
                      role="SNOWFLAKE_LEARNING_ROLE",
                      warehouse="SNOWFLAKE_LEARNING_WH",
                      database="SNOWFLAKE_LEARNING_DB",
                  )
                  with conn.cursor() as cur:
                      cur.execute("select current_user(), current_role()")
                      print("ESTUARY_SNOWFLAKE_JWT_ASSERTION=PASS", cur.fetchone())
                  conn.close()
                  break
              except Exception as exc:
                  last_error = exc
                  print("Waiting for Snowflake RSA public key assignment...")
                  time.sleep(10)
          else:
              raise RuntimeError(
                  "Timed out waiting for Snowflake public-key assignment"
              ) from last_error
          PY

      - name: Build Snowflake materialization spec
        env:
          FLOW_AUTH_TOKEN: ${{ secrets.FLOW_AUTH_TOKEN }}
        run: |
          export ESTUARY_SNOWFLAKE_PRIVATE_KEY="$(cat /tmp/estuary-key/rsa_key.p8)"
          python -m insurance_platform.estuary_flow_spec materialization \
            --output /tmp/estuary-materialization.yaml

      - name: Validate Snowflake materialization
        env:
          FLOW_AUTH_TOKEN: ${{ secrets.FLOW_AUTH_TOKEN }}
        run: |
          export ESTUARY_SNOWFLAKE_PRIVATE_KEY="$(cat /tmp/estuary-key/rsa_key.p8)"
          python -m insurance_platform.estuary_flow_spec materialization \
            --output /tmp/estuary-materialization.yaml
          flowctl catalog test --source /tmp/estuary-materialization.yaml

      - name: Publish Snowflake materialization
        env:
          FLOW_AUTH_TOKEN: ${{ secrets.FLOW_AUTH_TOKEN }}
        run: |
          flowctl catalog publish \
            --source /tmp/estuary-materialization.yaml \
            --auto-approve
          flowctl catalog list \
            --prefix "$ESTUARY_PREFIX/pet-insurance"

      - name: Wait for Snowflake history backfill
        run: sleep 30

      - name: Verify Estuary history in Snowflake
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE ROLE SNOWFLAKE_LEARNING_ROLE;
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            DESC TABLE PET_INSURANCE_ESTUARY.CLAIMS;

            SELECT COUNT(*) AS MATERIALIZED_ROWS
            FROM PET_INSURANCE_ESTUARY.CLAIMS;

            SELECT 1 / IFF(
              COUNT_IF(
                \"flow_document\":claim_id::VARCHAR = 'CLM-EST-36033857733'
                AND \"flow_document\":_meta:op::VARCHAR = 'c'
              ) >= 1
              AND COUNT_IF(
                \"flow_document\":claim_id::VARCHAR = 'CLM-EST-36033857733'
                AND \"flow_document\":_meta:op::VARCHAR = 'u'
              ) >= 1
              AND COUNT_IF(
                \"flow_document\":claim_id::VARCHAR = 'CLM-EST-36033857733'
                AND \"flow_document\":_meta:op::VARCHAR = 'd'
              ) >= 1,
              1, 0
            ) AS ESTUARY_SNOWFLAKE_CUD_HISTORY_ASSERTION
            FROM PET_INSURANCE_ESTUARY.CLAIMS;
          " -x
