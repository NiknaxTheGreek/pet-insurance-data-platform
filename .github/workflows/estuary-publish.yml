name: Estuary CDC Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-estuary-publish.trigger"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked project runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock.txt
          python -m pip install -e . --no-deps

      - name: Install flowctl
        run: |
          sudo curl -fsSL -o /usr/local/bin/flowctl             https://github.com/estuary/flow/releases/latest/download/flowctl-x86_64-linux
          sudo chmod +x /usr/local/bin/flowctl
          flowctl --version

      - name: Validate provider configuration
        env:
          FLOW_AUTH_TOKEN: ${{ secrets.FLOW_AUTH_TOKEN }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          ESTUARY_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.ESTUARY_SNOWFLAKE_PRIVATE_KEY }}
          ESTUARY_PREFIX: ${{ vars.ESTUARY_PREFIX }}
        run: |
          test -n "$FLOW_AUTH_TOKEN"
          test -n "$POSTGRES_DSN"
          test -n "$ESTUARY_SNOWFLAKE_PRIVATE_KEY"
          test -n "$ESTUARY_PREFIX"

      - name: Build isolated Neon capture specification
        env: &estuary_env
          FLOW_AUTH_TOKEN: ${{ secrets.FLOW_AUTH_TOKEN }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          ESTUARY_PREFIX: ${{ vars.ESTUARY_PREFIX }}
          ESTUARY_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.ESTUARY_SNOWFLAKE_PRIVATE_KEY }}
          ESTUARY_SNOWFLAKE_HOST: VEGYNBL-HC48216.snowflakecomputing.com
          ESTUARY_SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
          ESTUARY_SNOWFLAKE_SCHEMA: PET_INSURANCE_ESTUARY
          ESTUARY_SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          ESTUARY_SNOWFLAKE_ROLE: PET_INSURANCE_ESTUARY_ROLE
          ESTUARY_SNOWFLAKE_USER: PET_INSURANCE_ESTUARY
        run: |
          mkdir -p /tmp/estuary
          python -m insurance_platform.estuary_flow_spec capture             --output /tmp/estuary/flow.yaml

      - name: Discover only published public.claims
        env: *estuary_env
        run: |
          flowctl discover             --source /tmp/estuary/flow.yaml             --capture "$ESTUARY_PREFIX/pet-insurance/source-neon"

      - name: Add Snowflake materialization
        env: *estuary_env
        run: |
          python -m insurance_platform.estuary_flow_spec materialization             --output /tmp/estuary/flow.yaml

      - name: Validate Estuary catalog
        env: *estuary_env
        run: flowctl catalog test --source /tmp/estuary/flow.yaml

      - name: Publish Estuary CDC flow
        env: *estuary_env
        run: |
          flowctl catalog publish --source /tmp/estuary/flow.yaml --auto-approve
          flowctl catalog list --prefix "$ESTUARY_PREFIX/pet-insurance"
