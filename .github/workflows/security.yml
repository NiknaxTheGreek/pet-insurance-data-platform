name: Security Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "infra/**"
      - "integrations/**"
      - "requirements/**"
      - "Makefile"
      - "integrations/**"
      - "requirements/**"
      - "Makefile"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "infra/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tested runtime and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion,dev]"
          python -m pip install "dbt-snowflake==1.12.1" "pip-audit==2.10.1"

      - name: Audit installed Python environment
        run: python -m pip_audit --local --skip-editable

      - name: Static Python gate
        run: |
          python -m pip install "ruff==0.13.2"
          ruff check src tests --select E9,F --ignore F401

      - name: Validate integration shell scripts
        run: |
          bash -n integrations/gcp/bootstrap_gcp.sh
          bash -n integrations/gcp/run_bigquery_sandbox.sh
          bash -n integrations/estuary/generate_keypair.sh
