name: Platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "infra/postgres/**"
      - "dbt/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "infra/postgres/**"
      - "dbt/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/platform-ci.yml"

permissions:
  id-token: write
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked toolchain
        run: |
          python -m pip install -r requirements/ci.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Static Python checks
        run: ruff check src tests --select E9,F --ignore F401

      - name: Python tests
        run: pytest -q

  postgres-docker:
    name: PostgreSQL Docker smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked contract runtime
        run: |
          python -m pip install -r requirements/ci.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U insurance_app -d insurance; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Validate source contracts against clean Docker PostgreSQL
        env:
          POSTGRES_DSN: postgresql://insurance_app:insurance_dev@localhost:5432/insurance
        run: python -m insurance_platform.validate_contracts

      - name: Validate schema constraints and relationships
        run: |
          docker compose exec -T postgres             psql -U insurance_app -d insurance -v ON_ERROR_STOP=1             < infra/postgres/smoke_test.sql

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Tear down PostgreSQL
        if: always()
        run: docker compose down -v

  snowflake-dbt:
    name: Snowflake dbt build
    if: github.event_name != 'pull_request'
    needs: [python-quality, postgres-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Install locked dbt toolchain
        run: |
          python -m pip install -r requirements/ci.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: dbt debug
        env: &snowflake_env
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: dbt debug --project-dir dbt --profiles-dir dbt

      - name: dbt build
        env: *snowflake_env
        run: dbt build --project-dir dbt --profiles-dir dbt --fail-fast

      - name: Generate dbt docs
        env: *snowflake_env
        run: dbt docs generate --project-dir dbt --profiles-dir dbt

      - name: Verify trusted mart and claim history
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            SELECT 1 / IFF(
              COUNT(*) = 1
              AND MAX(CLAIM_STATUS) = 'PAID'
              AND MAX(CLAIM_AMOUNT) = 11200
              AND MAX(APPROVED_AMOUNT) = 9700
              AND MAX(PAID_AMOUNT) = 9700,
              1, 0
            ) AS TRUSTED_CLAIM_ASSERTION
            FROM PET_INSURANCE_MARTS.FCT_CLAIMS
            WHERE CLAIM_ID = 'CLM-10042';

            SELECT 1 / IFF(
              COUNT(*) = 3,
              1, 0
            ) AS CLAIM_HISTORY_ASSERTION
            FROM PET_INSURANCE_INTERMEDIATE.INT_CLAIM_EVENTS
            WHERE CLAIM_ID = 'CLM-10042';
          " -x

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-ci-dbt-artifacts
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/catalog.json
            dbt/target/index.html
