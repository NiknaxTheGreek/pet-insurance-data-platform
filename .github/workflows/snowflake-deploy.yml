name: Snowflake OIDC Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/snowflake/deploy.sql"
      - "infra/snowflake/verify_platform_objects.sql"
      - ".github/workflows/snowflake-deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  snowflake-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Snowflake CLI and obtain GitHub OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Verify OIDC identity
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: PUBLIC
        run: |
          snow connection test -x
          snow sql -q "SELECT CURRENT_ACCOUNT(), CURRENT_REGION(), CURRENT_USER(), CURRENT_ROLE(), CURRENT_AVAILABLE_ROLES();" -x

      - name: Deploy Snowflake platform objects
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: snow sql -f infra/snowflake/deploy.sql -x

      - name: Verify platform objects
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: snow sql -f infra/snowflake/verify_platform_objects.sql -x
