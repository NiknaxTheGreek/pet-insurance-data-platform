name: Source Schema Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-schema-evidence.yml"

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client dependency
        run: python -m pip install "psycopg[binary]==3.3.6"

      - name: Inspect live PostgreSQL schema
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg.rows import dict_row

          sql = """
          SELECT
              table_name,
              ordinal_position,
              column_name,
              data_type,
              is_nullable,
              character_maximum_length,
              numeric_precision,
              numeric_scale
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name IN (
              'customers','pets','policies','claims','claim_payments'
            )
          ORDER BY table_name, ordinal_position
          """

          with psycopg.connect(os.environ["POSTGRES_DSN"], row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute(sql)
                  for row in cur.fetchall():
                      print(
                          "|".join(
                              "" if row[key] is None else str(row[key])
                              for key in (
                                  "table_name",
                                  "ordinal_position",
                                  "column_name",
                                  "data_type",
                                  "is_nullable",
                                  "character_maximum_length",
                                  "numeric_precision",
                                  "numeric_scale",
                              )
                          )
                      )
          PY
