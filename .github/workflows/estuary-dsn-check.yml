name: Estuary Source DSN Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-estuary-dsn-check.trigger"

permissions:
  contents: read

jobs:
  dsn-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install -r requirements/ci.lock.txt
          python -m pip install -e . --no-deps

      - name: Verify derived direct Neon DSN can replicate logically
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          from insurance_platform.estuary_flow_spec import direct_neon_dsn, parse_postgres_dsn

          direct = direct_neon_dsn(os.environ["POSTGRES_DSN"])
          parsed = parse_postgres_dsn(direct)

          with psycopg.connect(direct) as conn:
              with conn.cursor() as cur:
                  cur.execute("SHOW wal_level")
                  wal_level = cur.fetchone()[0]
                  cur.execute("SELECT current_user")
                  role = cur.fetchone()[0]

          if wal_level.lower() != "logical":
              raise RuntimeError(f"Expected wal_level=logical, got {wal_level}")

          print("ESTUARY_DIRECT_DSN_ASSERTION=PASS")
          print("database=" + parsed["database"])
          print("port=" + parsed["address"].rsplit(":", 1)[-1])
          print("wal_level=" + wal_level)
          print("role=" + role)
          PY
