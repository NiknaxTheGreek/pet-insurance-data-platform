name: Reliability Failure Suite

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  reliability-suite:
    runs-on: ubuntu-latest
    env:
      LATE_CLAIM_ID: CLM-LATE-${{ github.run_id }}
      LATE_EXISTING_CLAIM_ID: CLM-E-${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion]"
          python -m pip install "dbt-snowflake==1.12.1"

      - name: Inject invalid payment date
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: python -m insurance_platform.reliability_scenarios inject-invalid-payment

      - name: Ingest invalid record
        env: &runtime_env
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: python -m insurance_platform.run_ingestion

      - name: Prove dbt detects the bad record
        env: *runtime_env
        run: |
          set +e
          dbt test             --project-dir dbt             --profiles-dir dbt             --select assert_payment_not_before_claim             > /tmp/expected-dq-failure.log 2>&1
          code=$?
          set -e
          cat /tmp/expected-dq-failure.log
          if [ "$code" -eq 0 ]; then
            echo "::error::Expected payment-before-claim data-quality test to fail, but it passed."
            exit 1
          fi
          grep -q "assert_payment_not_before_claim" /tmp/expected-dq-failure.log
          echo "Expected data-quality failure detected."

      - name: Repair invalid payment date
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: python -m insurance_platform.reliability_scenarios repair-invalid-payment

      - name: Ingest repaired record
        env: *runtime_env
        run: python -m insurance_platform.run_ingestion

      - name: Prove repaired record passes the rule
        env: *runtime_env
        run: |
          dbt test             --project-dir dbt             --profiles-dir dbt             --select assert_payment_not_before_claim

      - name: Insert deliberately late new claim
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          LATE_CLAIM_ID: ${{ env.LATE_CLAIM_ID }}
        run: python -m insurance_platform.reliability_scenarios insert-late-claim

      - name: Run normal watermark ingestion for late new claim
        env: *runtime_env
        run: python -m insurance_platform.run_ingestion

      - name: Prove watermark scan missed the late new claim
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;
            SELECT 1 / IFF(COUNT(*) = 0, 1, 0) AS LATE_NEW_CLAIM_MISSED_AS_EXPECTED
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claims'
              AND SOURCE_PK = '$LATE_CLAIM_ID';
          " -x

      - name: Reconcile full current source state
        env: *runtime_env
        run: python -m insurance_platform.reconcile_source_state

      - name: Replay reconciliation to prove duplicate protection
        env: *runtime_env
        run: python -m insurance_platform.reconcile_source_state

      - name: Verify late new claim recovered once
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;
            SELECT 1 / IFF(COUNT(*) = 1, 1, 0) AS LATE_NEW_CLAIM_RECOVERED_ONCE
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claims'
              AND SOURCE_PK = '$LATE_CLAIM_ID';
          " -x

      - name: Insert existing-key late claim baseline
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          LATE_EXISTING_CLAIM_ID: ${{ env.LATE_EXISTING_CLAIM_ID }}
        run: python -m insurance_platform.reliability_scenarios insert-late-existing-claim

      - name: Prove normal ingestion misses existing-key late baseline
        env: *runtime_env
        run: |
          python -m insurance_platform.run_ingestion
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;
            SELECT 1 / IFF(COUNT(*) = 0, 1, 0) AS EXISTING_KEY_BASELINE_MISSED
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claims'
              AND SOURCE_PK = '$LATE_EXISTING_CLAIM_ID';
          " -x

      - name: Reconcile existing-key late baseline
        env: *runtime_env
        run: python -m insurance_platform.reconcile_source_state

      - name: Mutate same claim behind the watermark
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          LATE_EXISTING_CLAIM_ID: ${{ env.LATE_EXISTING_CLAIM_ID }}
        run: python -m insurance_platform.reliability_scenarios mutate-late-existing-claim

      - name: Prove normal ingestion misses late version of existing key
        env: *runtime_env
        run: |
          python -m insurance_platform.run_ingestion
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;
            SELECT 1 / IFF(
              COUNT(*) = 1
              AND COUNT_IF(PAYLOAD:claim_amount::NUMBER = 2100) = 1,
              1, 0
            ) AS EXISTING_KEY_NEW_VERSION_MISSED
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claims'
              AND SOURCE_PK = '$LATE_EXISTING_CLAIM_ID';
          " -x

      - name: Reconcile late version of existing key
        env: *runtime_env
        run: python -m insurance_platform.reconcile_source_state

      - name: Replay existing-key reconciliation
        env: *runtime_env
        run: python -m insurance_platform.reconcile_source_state

      - name: Verify both existing-key versions are preserved exactly once
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            SELECT 1 / IFF(
              COUNT(*) = 2
              AND COUNT_IF(PAYLOAD:claim_amount::NUMBER = 2100) = 1
              AND COUNT_IF(PAYLOAD:claim_amount::NUMBER = 2600) = 1,
              1, 0
            ) AS EXISTING_KEY_LATE_VERSION_ASSERTION
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claims'
              AND SOURCE_PK = '$LATE_EXISTING_CLAIM_ID';

            WITH current_version AS (
              SELECT
                SOURCE_UPDATED_AT,
                PAYLOAD:claim_amount::NUMBER AS CLAIM_AMOUNT
              FROM PET_INSURANCE_RAW.SOURCE_RECORDS
              WHERE SOURCE_TABLE = 'claims'
                AND SOURCE_PK = '$LATE_EXISTING_CLAIM_ID'
              QUALIFY ROW_NUMBER() OVER (
                ORDER BY SOURCE_UPDATED_AT DESC, RAW_RECORD_ID DESC
              ) = 1
            )
            SELECT 1 / IFF(
              COUNT(*) = 1
              AND MAX(CLAIM_AMOUNT) = 2600
              AND MAX(SOURCE_UPDATED_AT) = TO_TIMESTAMP_TZ('2026-09-21 14:00:00+00'),
              1, 0
            ) AS EXISTING_KEY_CURRENT_VERSION_ASSERTION
            FROM current_version;
          " -x

      - name: Soft-delete a claim in PostgreSQL
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: python -m insurance_platform.reliability_scenarios soft-delete-claim

      - name: Ingest soft delete
        env: *runtime_env
        run: python -m insurance_platform.run_ingestion

      - name: Rebuild all dbt models and tests
        env: *runtime_env
        run: dbt build --project-dir dbt --profiles-dir dbt --fail-fast

      - name: Final no-change ingestion replay
        env: *runtime_env
        run: python -m insurance_platform.run_ingestion

      - name: Verify all reliability outcomes
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            WITH current_claim AS (
              SELECT OPERATION, PAYLOAD:is_deleted::boolean AS IS_DELETED
              FROM PET_INSURANCE_RAW.SOURCE_RECORDS
              WHERE SOURCE_TABLE = 'claims'
                AND SOURCE_PK = 'CLM-10043'
              QUALIFY ROW_NUMBER() OVER (
                ORDER BY SOURCE_UPDATED_AT DESC, RAW_RECORD_ID DESC
              ) = 1
            )
            SELECT 1 / IFF(
              COUNT(*) = 1
              AND MAX(OPERATION) = 'DELETE'
              AND MAX(IS_DELETED::int) = 1,
              1, 0
            ) AS SOFT_DELETE_RAW_ASSERTION
            FROM current_claim;

            SELECT 1 / IFF(COUNT(*) = 0, 1, 0) AS SOFT_DELETE_MART_ASSERTION
            FROM PET_INSURANCE_MARTS.FCT_CLAIMS
            WHERE CLAIM_ID = 'CLM-10043';

            WITH latest_payment AS (
              SELECT PAYLOAD:payment_date::date AS PAYMENT_DATE
              FROM PET_INSURANCE_RAW.SOURCE_RECORDS
              WHERE SOURCE_TABLE = 'claim_payments'
                AND SOURCE_PK = 'PAY-DQ-10043'
              QUALIFY ROW_NUMBER() OVER (
                ORDER BY SOURCE_UPDATED_AT DESC, RAW_RECORD_ID DESC
              ) = 1
            ),
            latest_claim AS (
              SELECT PAYLOAD:claim_date::date AS CLAIM_DATE
              FROM PET_INSURANCE_RAW.SOURCE_RECORDS
              WHERE SOURCE_TABLE = 'claims'
                AND SOURCE_PK = 'CLM-10043'
              QUALIFY ROW_NUMBER() OVER (
                ORDER BY SOURCE_UPDATED_AT DESC, RAW_RECORD_ID DESC
              ) = 1
            )
            SELECT 1 / IFF(
              COUNT(*) = 1
              AND MAX(PAYMENT_DATE) >= MAX(CLAIM_DATE),
              1, 0
            ) AS REPAIRED_PAYMENT_ASSERTION
            FROM latest_payment
            CROSS JOIN latest_claim;

            WITH latest_five AS (
              SELECT ROWS_EXTRACTED, ROWS_INSERTED
              FROM PET_INSURANCE_CONTROL.INGESTION_BATCHES
              WHERE GITHUB_RUN_ID = '${{ github.run_id }}'
                AND NOTES = 'watermark incremental PostgreSQL to Snowflake ingestion'
              QUALIFY ROW_NUMBER() OVER (ORDER BY STARTED_AT DESC) <= 5
            )
            SELECT 1 / IFF(
              COUNT(*) = 5
              AND SUM(ROWS_EXTRACTED) = 0
              AND SUM(ROWS_INSERTED) = 0,
              1, 0
            ) AS FINAL_REPLAY_ASSERTION
            FROM latest_five;

            WITH latest_reconciliation AS (
              SELECT ROWS_INSERTED
              FROM PET_INSURANCE_CONTROL.INGESTION_BATCHES
              WHERE GITHUB_RUN_ID = '${{ github.run_id }}'
                AND NOTES LIKE 'full-state reconciliation%'
              QUALIFY ROW_NUMBER() OVER (ORDER BY STARTED_AT DESC) <= 5
            )
            SELECT 1 / IFF(
              COUNT(*) = 5
              AND SUM(ROWS_INSERTED) = 0,
              1, 0
            ) AS RECONCILIATION_REPLAY_ASSERTION
            FROM latest_reconciliation;
          " -x
