name: T4 Paid Claim Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-t4-demo.trigger"

permissions:
  id-token: write
  contents: read

jobs:
  t4-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Install ingestion runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion]"

      - name: Apply idempotent T4 source mutation
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: python -m insurance_platform.apply_t4_demo

      - name: Ingest T4 incrementally
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: python -m insurance_platform.run_ingestion

      - name: Replay unchanged source
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: python -m insurance_platform.run_ingestion

      - name: Verify T4 history payment watermarks and idempotency
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            SELECT 1 / IFF(
              COUNT(*) = 3
              AND COUNT_IF(PAYLOAD:claim_status::VARCHAR = 'SUBMITTED') = 1
              AND COUNT_IF(PAYLOAD:claim_status::VARCHAR = 'APPROVED') = 1
              AND COUNT_IF(PAYLOAD:claim_status::VARCHAR = 'PAID') = 1,
              1, 0
            ) AS CLAIM_HISTORY_ASSERTION
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claims'
              AND SOURCE_PK = 'CLM-10042';

            WITH ranked AS (
              SELECT
                PAYLOAD:claim_amount::NUMBER AS CLAIM_AMOUNT,
                PAYLOAD:approved_amount::NUMBER AS APPROVED_AMOUNT,
                PAYLOAD:claim_status::VARCHAR AS CLAIM_STATUS,
                SOURCE_UPDATED_AT,
                ROW_NUMBER() OVER (
                  ORDER BY SOURCE_UPDATED_AT DESC, RAW_RECORD_ID DESC
                ) AS RN
              FROM PET_INSURANCE_RAW.SOURCE_RECORDS
              WHERE SOURCE_TABLE = 'claims'
                AND SOURCE_PK = 'CLM-10042'
            )
            SELECT 1 / IFF(
              COUNT(*) = 1
              AND MAX(CLAIM_AMOUNT) = 11200
              AND MAX(APPROVED_AMOUNT) = 9700
              AND MAX(CLAIM_STATUS) = 'PAID',
              1, 0
            ) AS CURRENT_STATE_ASSERTION
            FROM ranked
            WHERE RN = 1;

            SELECT 1 / IFF(
              COUNT(*) = 1
              AND MAX(PAYLOAD:payment_amount::NUMBER) = 9700
              AND MAX(PAYLOAD:payment_status::VARCHAR) = 'PAID',
              1, 0
            ) AS PAYMENT_ASSERTION
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claim_payments'
              AND SOURCE_PK = 'PAY-10042-T4';

            SELECT SOURCE_PK,
                   SOURCE_UPDATED_AT,
                   PAYLOAD:claim_amount::NUMBER AS CLAIM_AMOUNT,
                   PAYLOAD:approved_amount::NUMBER AS APPROVED_AMOUNT,
                   PAYLOAD:claim_status::VARCHAR AS CLAIM_STATUS,
                   BATCH_ID
            FROM PET_INSURANCE_RAW.SOURCE_RECORDS
            WHERE SOURCE_TABLE = 'claims'
              AND SOURCE_PK = 'CLM-10042'
            ORDER BY SOURCE_UPDATED_AT;

            SELECT SOURCE_TABLE, LAST_UPDATED_AT, LAST_SOURCE_PK
            FROM PET_INSURANCE_CONTROL.INGESTION_WATERMARKS
            WHERE SOURCE_TABLE IN ('claims', 'claim_payments')
            ORDER BY SOURCE_TABLE;
          " -x
