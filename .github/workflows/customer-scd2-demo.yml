name: Customer SCD2 Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/run-customer-scd2.trigger"

permissions:
  id-token: write
  contents: read

jobs:
  scd2-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtain Snowflake OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion]"
          python -m pip install "dbt-snowflake==1.12.1"

      - name: Apply customer attribute change
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: python -m insurance_platform.apply_customer_history_demo

      - name: Ingest customer change
        env: &runtime_env
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
          SNOWFLAKE_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          SNOWFLAKE_DATABASE: SNOWFLAKE_LEARNING_DB
        run: python -m insurance_platform.run_ingestion

      - name: Replay unchanged source
        env: *runtime_env
        run: python -m insurance_platform.run_ingestion

      - name: Rebuild dbt models and tests
        env: *runtime_env
        run: dbt build --project-dir dbt --profiles-dir dbt --fail-fast

      - name: Verify customer SCD2 history
        env:
          SNOWFLAKE_ACCOUNT: VEGYNBL-HC48216
          SNOWFLAKE_USER: PET_INSURANCE_GITHUB
          SNOWFLAKE_ROLE: SNOWFLAKE_LEARNING_ROLE
        run: |
          snow sql -q "
            USE WAREHOUSE SNOWFLAKE_LEARNING_WH;
            USE DATABASE SNOWFLAKE_LEARNING_DB;

            SELECT 1 / IFF(
              COUNT(*) = 2
              AND COUNT_IF(PROVINCE = 'Gauteng') = 1
              AND COUNT_IF(PROVINCE = 'Western Cape') = 1
              AND COUNT_IF(IS_CURRENT) = 1
              AND COUNT_IF(IS_CURRENT AND PROVINCE = 'Western Cape') = 1,
              1, 0
            ) AS CUSTOMER_SCD2_ASSERTION
            FROM PET_INSURANCE_MARTS.DIM_CUSTOMER_SCD2
            WHERE CUSTOMER_ID = 'CUS-00001';

            SELECT CUSTOMER_ID, PROVINCE, EFFECTIVE_FROM, EFFECTIVE_TO, IS_CURRENT
            FROM PET_INSURANCE_MARTS.DIM_CUSTOMER_SCD2
            WHERE CUSTOMER_ID = 'CUS-00001'
            ORDER BY EFFECTIVE_FROM;

            SELECT CUSTOMER_ID, PROVINCE, SOURCE_UPDATED_AT
            FROM PET_INSURANCE_STAGING.STG_CUSTOMERS
            WHERE CUSTOMER_ID = 'CUS-00001';

            SELECT 1 / IFF(COUNT(*) = 3, 1, 0) AS CLAIM_EVENT_IDEMPOTENCY_ASSERTION
            FROM PET_INSURANCE_INTERMEDIATE.INT_CLAIM_EVENTS
            WHERE CLAIM_ID = 'CLM-10042';
          " -x
