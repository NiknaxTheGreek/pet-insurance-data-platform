version: 2

models:
  - name: stg_customers
    description: Current customer state reconstructed from append-only RAW history.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]

  - name: stg_pets
    description: Current pet state reconstructed from append-only RAW history.
    columns:
      - name: pet_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_policies
    description: Current policy state reconstructed from append-only RAW history.
    columns:
      - name: policy_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: pet_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pets')
                field: pet_id

  - name: stg_claims
    description: Current claim state; historical claim events are retained separately in int_claim_events.
    columns:
      - name: claim_id
        data_tests: [not_null, unique]
      - name: policy_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_policies')
                field: policy_id
      - name: pet_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pets')
                field: pet_id
      - name: claim_status
        data_tests: [not_null]
      - name: claim_amount
        data_tests: [not_null]

  - name: stg_claim_payments
    description: Current claim-payment state reconstructed from RAW.
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: claim_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_claims')
                field: claim_id
      - name: payment_amount
        data_tests: [not_null]
