version: 2

models:
  - name: dim_policy
    description: Current policy dimension enriched with non-PII customer geography and pet attributes.
    config:
      contract:
        enforced: true
      meta:
        data_classification: analytics_minimized
        contains_direct_pii: false
    columns:
      - name: policy_id
        data_type: TEXT
        data_tests: [not_null, unique]
      - name: customer_id
        data_type: TEXT
        data_tests: [not_null]
      - name: pet_id
        data_type: TEXT
        data_tests: [not_null]
      - name: plan_type
        data_type: TEXT
      - name: policy_status
        data_type: TEXT
      - name: start_date
        data_type: DATE
      - name: end_date
        data_type: DATE
      - name: monthly_premium
        data_type: NUMBER
      - name: province
        data_type: TEXT
      - name: pet_name
        data_type: TEXT
      - name: species
        data_type: TEXT
      - name: breed
        data_type: TEXT

  - name: dim_customer_scd2
    description: Type-2 customer geography history derived from every customer version in append-only RAW.
    config:
      contract:
        enforced: true
      meta:
        data_classification: analytics_minimized
        contains_direct_pii: false
    columns:
      - name: customer_id
        data_type: TEXT
        data_tests: [not_null]
      - name: province
        data_type: TEXT
      - name: is_deleted
        data_type: BOOLEAN
      - name: effective_from
        data_type: TIMESTAMP_TZ
        data_tests: [not_null]
      - name: effective_to
        data_type: TIMESTAMP_TZ
      - name: is_current
        data_type: BOOLEAN
        data_tests: [not_null]

  - name: fct_claims
    description: Current claim fact enriched with policy, geography, pet, and payment context.
    config:
      contract:
        enforced: true
      meta:
        data_classification: analytics_minimized
        contains_direct_pii: false
    columns:
      - name: claim_id
        data_type: TEXT
        data_tests: [not_null, unique]
      - name: policy_id
        data_type: TEXT
        data_tests: [not_null]
      - name: pet_id
        data_type: TEXT
      - name: customer_id
        data_type: TEXT
      - name: province
        data_type: TEXT
      - name: plan_type
        data_type: TEXT
      - name: species
        data_type: TEXT
      - name: breed
        data_type: TEXT
      - name: claim_type
        data_type: TEXT
      - name: claim_status
        data_type: TEXT
      - name: claim_date
        data_type: DATE
      - name: claim_amount
        data_type: NUMBER
        data_tests: [not_null]
      - name: approved_amount
        data_type: NUMBER
      - name: paid_amount
        data_type: NUMBER
      - name: latest_payment_date
        data_type: DATE
      - name: source_updated_at
        data_type: TIMESTAMP_TZ

  - name: mart_portfolio_performance
    description: >
      Portfolio performance by province, species, and plan. paid_loss_ratio_proxy uses
      current monthly premium multiplied by 12 as an annualized premium proxy; it is a
      portfolio demonstration metric, not actuarial earned premium.
    config:
      contract:
        enforced: true
      meta:
        data_classification: analytics_minimized
        contains_direct_pii: false
    columns:
      - name: province
        data_type: TEXT
        data_tests: [not_null]
      - name: species
        data_type: TEXT
        data_tests: [not_null]
      - name: plan_type
        data_type: TEXT
        data_tests: [not_null]
      - name: policy_count
        data_type: NUMBER
      - name: active_policy_count
        data_type: NUMBER
      - name: monthly_premium_book
        data_type: NUMBER
      - name: annualized_premium_proxy
        data_type: NUMBER
      - name: claim_count
        data_type: NUMBER
      - name: incurred_claim_amount
        data_type: NUMBER
      - name: approved_claim_amount
        data_type: NUMBER
      - name: paid_claim_amount
        data_type: NUMBER
      - name: claims_per_policy
        data_type: NUMBER
      - name: average_claim_severity
        data_type: NUMBER
      - name: paid_loss_ratio_proxy
        data_type: NUMBER
